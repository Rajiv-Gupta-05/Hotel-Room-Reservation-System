<div class="auth-wrapper">
  <!-- Decorative background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-card glass-card">
    <!-- Logo / Branding -->
    <div class="auth-header">
      <div class="hotel-icon">🏨</div>
      <h1 class="font-serif">Grand Reserve</h1>
      <p class="auth-subtitle">Hotel Room Reservation System</p>
    </div>

    <h2 class="form-title">Welcome back</h2>
    <p class="form-description text-muted">Sign in to manage your reservations</p>

    <!-- Error alert -->
    <div *ngIf="errorMessage" class="alert alert-error mt-3" role="alert">
      <span>⚠</span> {{ errorMessage }}
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>

      <!-- Email Field -->
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input
          id="login-email"
          type="email"
          class="form-input"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
          [class.input-error]="f['email'].invalid && f['email'].touched"
        />
        <span class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['required']">
          Email is required
        </span>
        <span class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['email']">
          Please enter a valid email
        </span>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          class="form-input"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          [class.input-error]="f['password'].invalid && f['password'].touched"
        />
        <span class="field-error" *ngIf="f['password'].touched && f['password'].errors?.['required']">
          Password is required
        </span>
        <span class="field-error" *ngIf="f['password'].touched && f['password'].errors?.['minlength']">
          Password must be at least 6 characters
        </span>
      </div>

      <!-- Submit Button -->
      <button
        id="login-submit-btn"
        type="submit"
        class="btn btn-primary btn-full mt-4"
        [disabled]="isLoading"
      >
        <span *ngIf="isLoading" class="spinner"></span>
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <!-- Register Link -->
    <div class="auth-footer">
      <span class="text-muted text-sm">Don't have an account?</span>
      <a routerLink="/register" id="goto-register-link">Create account</a>
    </div>
  </div>
</div>
